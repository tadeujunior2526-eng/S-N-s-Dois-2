<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Só Nós Dois ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- TELA INICIAL -->
        <section id="inicio" class="tela ativa">

            <div class="coracao">❤️</div>

            <h1>Só Nós Dois</h1>

            <p>
                Um jogo feito para vocês dois.
            </p>

            <button onclick="abrirCategorias()">
                Começar ❤️
            </button>

        </section>


        <!-- CATEGORIAS -->
        <section id="categorias" class="tela">

            <div class="cabecalho">

                <div class="coracao pequeno">
                    ❤️
                </div>

                <h1>Escolha o jogo</h1>

                <p>
                    Escolha uma categoria para começar.
                </p>

            </div>

            <div class="categorias">

                <button
                    class="categoria-btn"
                    onclick="iniciarJogo('conhecendo')">

                    💕
                    <span>Conhecendo vocês</span>

                </button>


                <button
                    class="categoria-btn"
                    onclick="iniciarJogo('diversao')">

                    😂
                    <span>Diversão</span>

                </button>


                <button
                    class="categoria-btn"
                    onclick="iniciarJogo('desafios')">

                    🎮
                    <span>Desafios</span>

                </button>


                <button
                    class="categoria-btn"
                    onclick="iniciarJogo('romantico')">

                    ❤️
                    <span>Romântico</span>

                </button>

            </div>

            <button
                class="voltar"
                onclick="voltarInicio()">

                ← Voltar

            </button>

        </section>


        <!-- TELA DO JOGO -->
        <section id="jogo" class="tela">

            <div class="topo">

                <span id="categoria">
                    Categoria
                </span>

                <span id="numero">
                    1/1
                </span>

            </div>


            <div class="card">

                <div class="icone-pergunta">
                    ❤️
                </div>

                <h2 id="pergunta">
                    Pergunta
                </h2>

                <button
                    class="btn-principal"
                    onclick="proximaPergunta()">

                    Próxima ❤️

                </button>

            </div>


            <button
                class="voltar"
                onclick="abrirCategorias()">

                ← Escolher outra categoria

            </button>

        </section>


        <!-- RESULTADO -->
        <section id="resultado" class="tela">

            <div class="coracao">
                🎉
            </div>

            <h1>Parabéns!</h1>

            <p>
                Vocês completaram essa rodada.
            </p>


            <div class="card resultado-card">

                <div class="icone-pergunta">
                    ❤️
                </div>

                <h2>
                    Mais um momento compartilhado por vocês.
                </h2>

                <button
                    class="btn-principal"
                    onclick="abrirCategorias()">

                    Jogar novamente

                </button>

            </div>


            <button
                class="voltar"
                onclick="voltarInicio()">

                Página inicial

            </button>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
